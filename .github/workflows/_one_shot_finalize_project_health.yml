name: One-shot finalize Sanguo Project Health

on:
  push:
    branches:
      - align/project-health-sanguo-behavior-20260912
    paths:
      - .github/workflows/_one_shot_finalize_project_health.yml

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    env:
      PYTHONIOENCODING: 'utf-8'
      PYTHONUTF8: '1'
      FINALIZE_ATTEMPT: '5'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/project-health-sanguo-behavior-20260912
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Expose Sanguo main authority
        shell: pwsh
        run: |
          git show-ref --verify --quiet refs/heads/main
          if ($LASTEXITCODE -ne 0) {
            git branch main origin/main
          }
          git rev-parse refs/heads/main

      - name: Adapt fallback defaults and regenerate Project Health derived data
        shell: pwsh
        run: |
          $path = 'scripts/python/project_health_knowledge.py'
          $lines = Get-Content $path
          $start = [Array]::IndexOf($lines, 'DEFAULT_CONFIG = {')
          $end = [Array]::IndexOf($lines, 'def base_dir(root: Path) -> Path:')
          if ($start -lt 0 -or $end -le $start) { throw 'DEFAULT_CONFIG boundaries were not found' }
          $prefix = $lines[0..($start - 1)]
          $suffix = $lines[$end..($lines.Count - 1)]
          $block = @(
            'DEFAULT_CONFIG = {',
            "    'source_paths': SOURCE_PATHS,",
            "    'source_path_bindings': SOURCE_PATH_BINDINGS,",
            "    'gdd_paths': ['docs/gdd/ui-gdd-flow.md'],",
            "    'task_scene_bindings': [{",
            "        'task_id': 192, 'scene': 'Game.Godot/Scenes/UI/Task192MainMenuSurface.tscn', 'node': '.',",
            "        'script': 'Game.Godot/Scripts/UI/Task192MainMenuSurface.gd',",
            "        'witness': 'func get_surface_contract_key() -> String:'",
            '    }],',
            "    'query_aliases': {",
            "        '主菜单': ['MainMenu'], '开始菜单': ['MainMenu'], '设置': ['Settings'],",
            "        '战斗': ['Battle', 'SanguoBattle'], '三国': ['Sanguo']",
            '    },',
            '}',
            '',
            ''
          )
          $updated = @($prefix + $block + $suffix)
          [System.IO.File]::WriteAllLines((Resolve-Path $path), $updated, (New-Object System.Text.UTF8Encoding($false)))

          Remove-Item docs/knowledge/generated/task-115-semantic.json -ErrorAction SilentlyContinue
          Remove-Item docs/knowledge/generated/task-18-semantic.json -ErrorAction SilentlyContinue

          py -3 scripts/python/project_health_knowledge.py scan --repo-root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 scripts/python/generate_knowledge_links.py --repo-root .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $main = (git rev-parse refs/heads/main).Trim()
          $links = Get-Content docs/knowledge/generated/task-resource-links.json -Raw | ConvertFrom-Json
          if ($links.source_revision -ne $main) {
            throw "task-resource-links source_revision $($links.source_revision) does not match main $main"
          }
          if (Test-Path docs/knowledge/generated/task-115-semantic.json) { throw 'stale task-115 semantic remains' }
          if (Test-Path docs/knowledge/generated/task-18-semantic.json) { throw 'stale task-18 semantic remains' }

      - name: Adapt Impact repository identity and hard gate registration
        shell: pwsh
        run: |
          @'
          import json
          from pathlib import Path

          config_path = Path('scripts/python/impact_analysis_config.v1.json')
          config = json.loads(config_path.read_text(encoding='utf-8'))
          config['identity_files'] = [p for p in config['identity_files'] if p != 'global.json']
          if 'GodotGame.csproj' not in config['identity_files']:
              config['identity_files'].insert(1, 'GodotGame.csproj')
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8', newline='\n')

          test_path = Path('scripts/python/tests/test_impact_analysis_index.py')
          text = test_path.read_text(encoding='utf-8')
          text = text.replace('"NewRouge.csproj": "<Project Sdk=\\"Godot.NET.Sdk/4.5.1\\" />\\n",', '"GodotGame.csproj": "<Project Sdk=\\"Godot.NET.Sdk/4.5.1\\" />\\n",')
          text = text.replace('            "global.json": "{\\"sdk\\":{\\"version\\":\\"8.0.100\\"}}\\n",\n', '')
          test_path.write_text(text, encoding='utf-8', newline='\n')

          gate_path = Path('scripts/python/run_gate_bundle.py')
          gate = gate_path.read_text(encoding='utf-8')
          marker = '                "scripts.sc.tests.test_migrate_task_optional_hints",\n                "-v",'
          addition = '''                "scripts.sc.tests.test_migrate_task_optional_hints",\n                "scripts.python.tests.test_impact_analysis_index",\n                "scripts.python.tests.test_impact_analysis_index_repository_smoke",\n                "scripts.python.tests.test_analyze_impact_cli",\n                "scripts.python.tests.test_impact_analyzer",\n                "scripts.python.tests.test_run_single_task_chapter6_lane",\n                "-v",'''
          if 'scripts.python.tests.test_impact_analysis_index' not in gate:
              if marker not in gate:
                  raise SystemExit('obligations_unittest insertion point not found')
              gate = gate.replace(marker, addition, 1)
          gate_path.write_text(gate, encoding='utf-8', newline='\n')
          '@ | py -3 -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Project Health localhost regressions
        shell: pwsh
        env:
          CI: ''
        run: |
          py -3 -m unittest scripts.sc.tests.test_project_health_sanguo_config scripts.sc.tests.test_project_health_http_surface scripts.sc.tests.test_project_health_server scripts.sc.tests.test_project_health_cli_status scripts.sc.tests.test_dev_cli_project_health_commands -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check scripts/python/project_health_knowledge.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Knowledge control plane regressions
        shell: pwsh
        run: |
          py -3 scripts/python/validate_knowledge_control_plane.py --require-generated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Impact regressions
        shell: pwsh
        run: |
          py -3 -m unittest discover -s scripts/python/tests -p 'test_impact*.py' -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit final Sanguo-derived state
        shell: pwsh
        run: |
          Remove-Item .github/workflows/_one_shot_finalize_project_health.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/python/project_health_knowledge.py
          git add scripts/python/impact_analysis_config.v1.json
          git add scripts/python/tests/test_impact_analysis_index.py
          git add scripts/python/run_gate_bundle.py
          git add docs/knowledge/generated
          git add docs/knowledge/catalog/knowledge-catalog.json
          git add -u .github/workflows/_one_shot_finalize_project_health.yml
          git diff --cached --check
          git commit -m "chore: regenerate Sanguo Project Health knowledge"
          git push origin HEAD:align/project-health-sanguo-behavior-20260912
