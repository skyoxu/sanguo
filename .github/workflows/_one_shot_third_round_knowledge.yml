name: One-shot third-round knowledge repair

on:
  push:
    branches:
      - fix/knowledge-publication-lifecycle-20260912
    paths:
      - 'scripts/python/_third_round_run_marker.py'

permissions:
  contents: write

jobs:
  repair:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/knowledge-publication-lifecycle-20260912
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Expose main authority
        shell: pwsh
        run: |
          git branch -f main origin/main
          git rev-parse refs/heads/main

      - name: Apply non-workflow repairs
        shell: pwsh
        run: |
          py -3 scripts/python/_third_round_knowledge_patch.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 scripts/python/_third_round_followup_fix.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git checkout -- .github/workflows/project-health-behavior.yml .github/workflows/publish-knowledge-catalog.yml

      - name: Rebuild Sanguo Project Health resource knowledge
        shell: pwsh
        env:
          PYTHONIOENCODING: 'utf-8'
          PYTHONUTF8: '1'
        run: |
          py -3 scripts/python/project_health_knowledge.py scan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 scripts/python/generate_knowledge_links.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item -Force -ErrorAction SilentlyContinue docs/knowledge/generated/task-115-semantic.json
          Remove-Item -Force -ErrorAction SilentlyContinue docs/knowledge/generated/task-18-semantic.json
          $mainSha = (git rev-parse refs/heads/main).Trim()
          $links = Get-Content docs/knowledge/generated/task-resource-links.json -Raw | ConvertFrom-Json
          $catalog = Get-Content docs/knowledge/catalog/knowledge-catalog.json -Raw | ConvertFrom-Json
          if ($links.source_revision -ne $mainSha) { throw "task-resource-links source_revision mismatch: $($links.source_revision) != $mainSha" }
          if ($links.generated.Count -lt 1) { throw 'task-resource-links rebuild produced no entries' }
          if ($catalog.project -ne 'sanguo') { throw "knowledge catalog project identity is not Sanguo: $($catalog.project)" }
          $tracked = @{}
          git ls-tree -r --name-only refs/heads/main | ForEach-Object { $tracked[$_] = $true }
          $allEntries = @($links.generated) + @($catalog.entries)
          $missing = @($allEntries | Where-Object { $_.path -and -not $tracked.ContainsKey([string]$_.path) })
          if ($missing.Count -gt 0) {
            $sample = ($missing | Select-Object -First 10 | ForEach-Object { $_.path }) -join ', '
            throw "rebuilt resource entries reference paths absent from Sanguo main: $sample"
          }
          if (Test-Path docs/knowledge/generated/task-115-semantic.json) { throw 'stale task-115 semantic file remains' }
          if (Test-Path docs/knowledge/generated/task-18-semantic.json) { throw 'stale task-18 semantic file remains' }

      - name: Run focused regressions
        shell: pwsh
        env:
          PYTHONIOENCODING: 'utf-8'
          PYTHONUTF8: '1'
          CI: ''
        run: |
          py -3 -m unittest scripts.sc.tests.test_project_health_sanguo_config scripts.python.tests.test_generate_knowledge_links -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 -m unittest scripts.python.tests.test_knowledge_publication scripts.python.tests.test_knowledge_freeze -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit and push non-workflow repair
        shell: pwsh
        run: |
          Remove-Item -Force scripts/python/_third_round_knowledge_patch.py
          Remove-Item -Force scripts/python/_third_round_followup_fix.py
          Remove-Item -Force scripts/python/_third_round_run_marker.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          $paths = @(
            'docs/knowledge/catalog/knowledge-catalog.json',
            'docs/knowledge/generated/task-resource-links.json',
            'docs/knowledge/generated/task-115-semantic.json',
            'docs/knowledge/generated/task-18-semantic.json',
            'knowledge/README.md',
            'scripts/python/freeze_knowledge_context.py',
            'scripts/python/generate_knowledge_links.py',
            'scripts/python/init_knowledge_catalog.py',
            'scripts/python/knowledge_locator.py',
            'scripts/python/project_health_knowledge.py',
            'scripts/python/publish_knowledge_catalog.py',
            'scripts/python/tests/test_generate_knowledge_links.py',
            'scripts/python/tests/test_knowledge_freeze.py',
            'scripts/python/tests/test_knowledge_publication.py',
            'scripts/sc/tests/test_project_health_sanguo_config.py',
            'scripts/python/_third_round_knowledge_patch.py',
            'scripts/python/_third_round_followup_fix.py',
            'scripts/python/_third_round_run_marker.py'
          )
          git add -A -- $paths
          $unexpected = git status --porcelain | Where-Object { $_ -notmatch '^.. (docs/knowledge/|knowledge/README.md|scripts/python/|scripts/sc/tests/test_project_health_sanguo_config.py)' }
          if ($unexpected) { throw "unexpected worktree changes: $($unexpected -join '; ')" }
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { throw 'third-round repair produced no staged changes' }
          git commit -m 'fix: close Sanguo knowledge publication lifecycle'
          git push origin HEAD:fix/knowledge-publication-lifecycle-20260912
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git reset --hard HEAD
          if (git status --porcelain) { throw 'repair push did not leave a clean worktree' }

      - name: Validate reproducible Knowledge publication
        shell: pwsh
        env:
          PYTHONIOENCODING: 'utf-8'
          PYTHONUTF8: '1'
        run: |
          py -3 scripts/python/publish_knowledge_catalog.py --publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 scripts/python/publish_knowledge_catalog.py --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          py -3 scripts/python/validate_knowledge_control_plane.py --require-generated
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git reset --hard HEAD
          git clean -fd -- knowledge/indexes/generations
          if (git status --porcelain) { throw 'publication validation cleanup did not restore a clean worktree' }

      - name: Verify persistent workflow governance
        shell: pwsh
        run: |
          Remove-Item -Force .github/workflows/_one_shot_third_round_knowledge.yml
          py -3 scripts/python/check_workflow_gate_enforcement.py
          $gateCode = $LASTEXITCODE
          git checkout -- .github/workflows/_one_shot_third_round_knowledge.yml
          if ($gateCode -ne 0) { exit $gateCode }
          if (git status --porcelain) { throw 'third-round repair left uncommitted files' }
