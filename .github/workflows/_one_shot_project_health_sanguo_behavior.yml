name: One-shot Project Health Sanguo behavior alignment

on:
  push:
    branches:
      - align/project-health-sanguo-behavior-20260912
    paths:
      - .github/workflows/_one_shot_project_health_sanguo_behavior.yml

permissions:
  contents: write

jobs:
  align:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/project-health-sanguo-behavior-20260912
          fetch-depth: 0

      - name: Adapt Project Health to Sanguo and add regression gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path('.')

          config_path = root / 'scripts/python/project_health_knowledge_config.json'
          config = json.loads(config_path.read_text(encoding='utf-8'))
          config['task_scene_bindings'] = [{
              'task_id': 192,
              'scene': 'Game.Godot/Scenes/UI/Task192MainMenuSurface.tscn',
              'node': '.',
              'script': 'Game.Godot/Scripts/UI/Task192MainMenuSurface.gd',
              'witness': 'func get_surface_contract_key() -> String:',
          }]
          config['query_aliases'] = {
              '主菜单': ['MainMenu'],
              '开始菜单': ['MainMenu'],
              '设置': ['Settings'],
              '战斗': ['Battle', 'SanguoBattle'],
              '三国': ['Sanguo'],
          }
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          knowledge_path = root / 'scripts/python/project_health_knowledge.py'
          knowledge = knowledge_path.read_text(encoding='utf-8')
          old = """    'task_scene_bindings': [{
        'task_id': 115, 'scene': 'Game.Godot/Scenes/Reward.tscn', 'node': '.',
        'script': 'Game.Godot/Scripts/RewardScene.gd',
        'witness': 'func _claim_reward(reward_type: String, selected_card_id: String, selected_index: int) -> void:'
    }],
    'query_aliases': {'奖励': ['Reward'], '存档': ['Save'], '战斗': ['Combat']},
"""
          new = """    'task_scene_bindings': [{
        'task_id': 192, 'scene': 'Game.Godot/Scenes/UI/Task192MainMenuSurface.tscn', 'node': '.',
        'script': 'Game.Godot/Scripts/UI/Task192MainMenuSurface.gd',
        'witness': 'func get_surface_contract_key() -> String:'
    }],
    'query_aliases': {
        '主菜单': ['MainMenu'], '开始菜单': ['MainMenu'], '设置': ['Settings'],
        '战斗': ['Battle', 'SanguoBattle'], '三国': ['Sanguo'],
    },
"""
          if old not in knowledge:
              raise SystemExit('Expected newrouge Project Health default config block was not found')
          knowledge_path.write_text(knowledge.replace(old, new, 1), encoding='utf-8')

          test_path = root / 'scripts/sc/tests/test_project_health_sanguo_config.py'
          test_path.write_text(r'''#!/usr/bin/env python3
from __future__ import annotations

import json
import sys
import unittest
from pathlib import Path

ROOT = Path(__file__).resolve().parents[3]
PYTHON_DIR = ROOT / "scripts" / "python"
if str(PYTHON_DIR) not in sys.path:
    sys.path.insert(0, str(PYTHON_DIR))

from project_health_knowledge import DEFAULT_CONFIG, validate_config


class ProjectHealthSanguoConfigTests(unittest.TestCase):
    def setUp(self) -> None:
        self.path = ROOT / "scripts/python/project_health_knowledge_config.json"
        self.config = json.loads(self.path.read_text(encoding="utf-8"))

    def test_persisted_config_matches_python_fallback(self) -> None:
        self.assertEqual(self.config, DEFAULT_CONFIG)
        self.assertEqual(validate_config(ROOT, self.config), self.config)

    def test_task_scene_bindings_are_real_sanguo_surfaces(self) -> None:
        bindings = self.config.get("task_scene_bindings", [])
        self.assertTrue(bindings)
        for binding in bindings:
            scene = ROOT / binding["scene"]
            script = ROOT / binding["script"]
            self.assertTrue(scene.is_file(), binding["scene"])
            self.assertTrue(script.is_file(), binding["script"])
            scene_text = scene.read_text(encoding="utf-8")
            script_text = script.read_text(encoding="utf-8")
            self.assertIn("res://" + binding["script"], scene_text)
            self.assertIn(binding["witness"], script_text)

    def test_default_binding_uses_task_192_main_menu_not_newrouge_reward(self) -> None:
        binding = self.config["task_scene_bindings"][0]
        self.assertEqual(binding["task_id"], 192)
        self.assertEqual(binding["scene"], "Game.Godot/Scenes/UI/Task192MainMenuSurface.tscn")
        self.assertNotIn("Reward", json.dumps(self.config, ensure_ascii=False))

    def test_query_aliases_cover_sanguo_navigation_terms(self) -> None:
        aliases = self.config["query_aliases"]
        self.assertIn("MainMenu", aliases["主菜单"])
        self.assertIn("SanguoBattle", aliases["战斗"])
        self.assertIn("Sanguo", aliases["三国"])


if __name__ == "__main__":
    unittest.main()
''', encoding='utf-8')

          workflow_path = root / '.github/workflows/windows-quality-gate.yml'
          workflow = workflow_path.read_text(encoding='utf-8')
          step_name = 'Project Health behavior regressions'
          if step_name not in workflow:
              anchor = '      - name: Governance gate bundle\n'
              if anchor not in workflow:
                  raise SystemExit('Could not find Governance gate bundle anchor')
              step = '''      - name: Project Health behavior regressions
        shell: pwsh
        run: |
          py -3 -m unittest scripts.sc.tests.test_project_health_sanguo_config scripts.sc.tests.test_project_health_server scripts.sc.tests.test_project_health_cli_status scripts.sc.tests.test_dev_cli_project_health_commands -v
          py -3 -m unittest discover -s scripts/python/tests -p "test_impact*.py" -v
          node --check scripts/python/project_health_knowledge.js

'''
              workflow_path.write_text(workflow.replace(anchor, step + anchor, 1), encoding='utf-8')
          PY

          rm .github/workflows/_one_shot_project_health_sanguo_behavior.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix: adapt Project Health knowledge behavior to Sanguo"
          git push origin HEAD:align/project-health-sanguo-behavior-20260912
