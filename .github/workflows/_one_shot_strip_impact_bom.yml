name: One-shot strip Impact BOM

on:
  push:
    branches:
      - align/project-health-sanguo-behavior-20260912
    paths:
      - .github/workflows/_one_shot_strip_impact_bom.yml

permissions:
  contents: write

jobs:
  strip-bom:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: align/project-health-sanguo-behavior-20260912
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Strip UTF-8 BOM from exact Impact source set
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          paths = [
              'Game.Godot/Adapters/Db/UserRepository.cs',
              'Game.Godot/Examples/Components/EventListenerPanel.cs',
              'Game.Godot/Examples/Components/EventListenerPanel.tscn',
              'Game.Godot/Examples/Components/Modal.tscn',
              'Game.Godot/Examples/Components/PrimaryButton.cs',
              'Game.Godot/Examples/Components/PrimaryButton.tscn',
              'Game.Godot/Examples/Components/Toast.tscn',
              'Game.Godot/Examples/README.md',
              'Game.Godot/Examples/Screens/DemoScreen.tscn',
              'Game.Godot/Examples/UI/CombatPanel.tscn',
              'Game.Godot/Examples/UI/InventoryPanel.cs',
              'Game.Godot/Fonts/README.md',
              'Game.Godot/Scripts/Bootstrap/InputMapper.cs',
              'Game.Godot/Scripts/Screens/SettingsScreen.cs',
              'Game.Godot/Scripts/Security/SecurityAudit.cs',
              'Game.Godot/Scripts/Security/SecurityHttpClient.cs',
              'decision-logs/2026-05-01-task-166-chapter6-residual-needs-fix.md',
              'execution-plans/2026-05-01-task-166-chapter6-residual-followup.md',
          ]
          bom = b'\xef\xbb\xbf'
          changed = []
          for raw in paths:
              path = Path(raw)
              data = path.read_bytes()
              if not data.startswith(bom):
                  raise SystemExit(f'expected BOM missing: {raw}')
              payload = data[len(bom):]
              path.write_bytes(payload)
              if path.read_bytes() != payload:
                  raise SystemExit(f'write verification failed: {raw}')
              changed.append(raw)
          print(f'STRIPPED_BOM_COUNT={len(changed)}')
          for path in changed:
              print(f'STRIPPED_BOM {path}')
          '@ | py -3 -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify Impact-selected sources have no BOM
        shell: pwsh
        run: |
          @'
          import json
          import subprocess
          import sys
          from pathlib import Path

          root = Path.cwd()
          sys.path.insert(0, str(root / 'scripts/python'))
          import impact_analysis_index as index
          config = index.validate_config(json.loads((root / 'scripts/python/impact_analysis_config.v1.json').read_text(encoding='utf-8')))
          identities = set(config['identity_files'])
          roots = config['scan_roots']
          violations = []
          for path in subprocess.check_output(['git', 'ls-files'], text=True, encoding='utf-8').splitlines():
              selected = (
                  index._path_selected(path, roots, identities)
                  and index._exclusion_reason(path, config['exclusions']) is None
                  and index._source_rule(path, config['source_rules']) is not None
                  and not path.lower().endswith('.gd')
              )
              if selected and (root / path).is_file() and (root / path).read_bytes().startswith(b'\xef\xbb\xbf'):
                  violations.append(path)
          print(f'IMPACT_BOM_COUNT={len(violations)}')
          for path in violations:
              print(f'IMPACT_BOM {path}')
          if violations:
              raise SystemExit(1)
          '@ | py -3 -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit normalized sources
        shell: pwsh
        run: |
          Remove-Item .github/workflows/_one_shot_strip_impact_bom.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Game.Godot/Adapters/Db/UserRepository.cs
          git add Game.Godot/Examples/Components/EventListenerPanel.cs
          git add Game.Godot/Examples/Components/EventListenerPanel.tscn
          git add Game.Godot/Examples/Components/Modal.tscn
          git add Game.Godot/Examples/Components/PrimaryButton.cs
          git add Game.Godot/Examples/Components/PrimaryButton.tscn
          git add Game.Godot/Examples/Components/Toast.tscn
          git add Game.Godot/Examples/README.md
          git add Game.Godot/Examples/Screens/DemoScreen.tscn
          git add Game.Godot/Examples/UI/CombatPanel.tscn
          git add Game.Godot/Examples/UI/InventoryPanel.cs
          git add Game.Godot/Fonts/README.md
          git add Game.Godot/Scripts/Bootstrap/InputMapper.cs
          git add Game.Godot/Scripts/Screens/SettingsScreen.cs
          git add Game.Godot/Scripts/Security/SecurityAudit.cs
          git add Game.Godot/Scripts/Security/SecurityHttpClient.cs
          git add decision-logs/2026-05-01-task-166-chapter6-residual-needs-fix.md
          git add execution-plans/2026-05-01-task-166-chapter6-residual-followup.md
          git add -u .github/workflows/_one_shot_strip_impact_bom.yml
          git diff --cached --check
          git commit -m "chore: normalize Impact-indexed sources to UTF-8 no BOM"
          git push origin HEAD:align/project-health-sanguo-behavior-20260912
